# Laptop alone (the external screen is skipped when not connected).
description = "Laptop only, power saver"
power_profile = "power-saver"
night_light = 4500

[brightness]                            # monitor match = percent
"AU Optronics 0x7EAD" = 60

[[monitor]]
match = "AU Optronics 0x7EAD"
mode = "preferred"
position = "0x0"
