[package]
name = "stance"
version = "0.0.1"
edition = "2024"
description = "Bar-first display settings and modes for Hyprland"
license = "MIT"
repository = "https://github.com/H0dg4m/stance-hypr"
readme = "README.md"
keywords = ["hyprland", "wayland", "monitor", "display", "quickshell"]
categories = ["command-line-utilities"]

[dependencies]
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.2.1", default-features = false, features = ["parse", "display", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
