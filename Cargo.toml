[package]
name = "stance"
version = "0.2.0"
edition = "2024"
description = "Bar-first display settings and modes for Hyprland"
license = "MIT"
repository = "https://github.com/H0dg4m/stance-hypr"
readme = "README.md"
keywords = ["hyprland", "wayland", "monitor", "display", "quickshell"]
categories = ["command-line-utilities"]

[dependencies]
base64 = "0.23"
libc = "0.2.191"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
snow = { version = "0.10.0", default-features = false, features = ["std", "default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "display", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"

# Daemon, guardian and deck server must not panic on input (1.0 criterion).
# Tests may (clippy.toml).
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
