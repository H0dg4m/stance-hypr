name: release
# A pushed tag vX.Y.Z builds a static (musl) binary, the tarball and
# SHA256SUMS, and publishes a GitHub release with the CHANGELOG section.
# Run by hand (workflow_dispatch) it only builds and uploads the artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Alpine: musl toolchain for a static binary (`ring` needs a C compiler).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: rust:alpine
    steps:
      - run: apk add --no-cache musl-dev file
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Static binary
        run: |
          b=target/release/stance
          file "$b" | grep -Eq "static|static-pie"
          "$b" --version
      - name: Tarball
        shell: sh
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml $v"; exit 1
          fi
          d=dist/stance-$v
          mkdir -p "$d"
          cp target/release/stance LICENSE README.md CHANGELOG.md "$d/"
          cp -r quickshell examples contrib docs "$d/"
          tar -C dist -czf "dist/stance-$v-x86_64-linux.tar.gz" "stance-$v"
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          awk -v v="$v" '$0 ~ "^## " v {f=1;next} /^## /{f=0} f' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "See CHANGELOG.md" > dist/notes.md
          echo "$v" > dist/VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stance-dist
          path: dist/
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stance-dist
          path: dist
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "stance $(cat dist/VERSION)" \
            --notes-file dist/notes.md dist/*.tar.gz dist/SHA256SUMS
