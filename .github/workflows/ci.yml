name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build && tests/upgrade.sh target/debug/stance && tests/fake.sh target/debug/stance && tests/theme-convert.sh target/debug/stance
  qml-and-scripts:
    # QML must parse (qmlformat is a strict parser; Quickshell types are not
    # available on the runner, so qmllint would only report those), every
    # panel string has a Turkish translation, shell scripts parse.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # qmlformat from PyPI (PySide6) instead of apt: no dependency on the
      # Ubuntu mirrors, which have failed DNS on the runners.
      - run: pip install --quiet "PySide6-Essentials>=6.7"
      - name: QML parses
        run: |
          for f in quickshell/stance/*.qml quickshell/integrations/*/*.qml; do
            pyside6-qmlformat "$f" > /dev/null || { echo "QML parse error: $f"; exit 1; }
          done
      - run: python3 scripts/i18n-check.py
      - run: scripts/qml-plaintext-check.sh
      - name: Shell scripts parse
        run: for f in tests/*.sh contrib/*.sh; do bash -n "$f"; done
  qml-smoke:
    # The panel, every board size and every settings page built offscreen
    # against the fake backend; fails on any QML error (tests/qml-smoke.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed quickshell qt6-declarative rust gcc jq
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo build
      - run: useradd -m runner && chown -R runner . && su runner -c "tests/qml-smoke.sh target/debug/stance qml-shots"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qml-shots
          path: qml-shots/
  musl:
    # The release builds this target; break it here, not at tag time.
    # Alpine has the musl C toolchain that `ring` needs.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: rust:alpine
    steps:
      - run: apk add --no-cache musl-dev file
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo build --release --locked
      - run: |
          b=target/release/stance
          file "$b" | grep -Eq "static|static-pie"
          "$b" --version
  nix:
    # flake.nix builds and installs (no flake.lock is committed: nixpkgs
    # follows nixos-unstable).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - run: nix build .#stance -L
      - run: ./result/bin/stance --version && ls result/lib/systemd/user result/share/stance
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
