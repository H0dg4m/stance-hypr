name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build && tests/upgrade.sh target/debug/stance && tests/fake.sh target/debug/stance
  qml-and-scripts:
    # QML must parse (qmlformat is a strict parser; Quickshell types are not
    # available on the runner, so qmllint would only report those), every
    # panel string has a Turkish translation, shell scripts parse.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # qmlformat from PyPI (PySide6) instead of apt: no dependency on the
      # Ubuntu mirrors, which have failed DNS on the runners.
      - run: pip install --quiet "PySide6-Essentials>=6.7"
      - name: QML parses
        run: |
          for f in quickshell/stance/*.qml quickshell/integrations/*/*.qml; do
            pyside6-qmlformat "$f" > /dev/null || { echo "QML parse error: $f"; exit 1; }
          done
      - run: python3 scripts/i18n-check.py
      - name: Shell scripts parse
        run: for f in tests/*.sh contrib/*.sh; do bash -n "$f"; done
  qml-smoke:
    # The panel, every board size and every settings page built offscreen
    # against the fake backend; fails on any QML error (tests/qml-smoke.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed quickshell qt6-declarative rust gcc jq
      - uses: actions/checkout@v4
      - run: cargo build
      - run: useradd -m runner && chown -R runner . && su runner -c "tests/qml-smoke.sh target/debug/stance qml-shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qml-shots
          path: qml-shots/
  musl:
    # The release builds this target; break it here, not at tag time.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - run: |
          b=target/x86_64-unknown-linux-musl/release/stance
          file "$b" | grep -q "static"
          "$b" --version
  nix:
    # flake.nix builds and installs (no flake.lock is committed: nixpkgs
    # follows nixos-unstable).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build .#stance -L
      - run: ./result/bin/stance --version && ls result/lib/systemd/user result/share/stance
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
