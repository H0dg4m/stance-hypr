name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build && tests/upgrade.sh target/debug/stance
  qml-and-scripts:
    # QML must parse (qmlformat is a strict parser; Quickshell types are not
    # available on the runner, so qmllint would only report those), every
    # panel string has a Turkish translation, shell scripts parse.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
      - name: QML parses
        run: |
          fmt=$(ls /usr/lib/qt6/bin/qmlformat /usr/lib/qt6/libexec/qmlformat 2>/dev/null | head -1)
          for f in quickshell/stance/*.qml quickshell/integrations/*/*.qml; do
            "$fmt" "$f" > /dev/null || { echo "QML parse error: $f"; exit 1; }
          done
      - run: python3 scripts/i18n-check.py
      - name: Shell scripts parse
        run: for f in tests/*.sh contrib/*.sh; do bash -n "$f"; done
  android-core:
    # The phone's Noise/protocol core against test vectors and a real
    # `stance deck serve` on loopback; app screens and reconnect logic
    # under Robolectric.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew :core:test :app:testDebugUnitTest -Dstance.binary=$GITHUB_WORKSPACE/target/debug/stance
        working-directory: android
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
