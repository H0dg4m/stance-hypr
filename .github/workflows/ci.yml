name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build && tests/upgrade.sh target/debug/stance && tests/fake.sh target/debug/stance
  qml-and-scripts:
    # QML must parse (qmlformat is a strict parser; Quickshell types are not
    # available on the runner, so qmllint would only report those), every
    # panel string has a Turkish translation, shell scripts parse.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # qmlformat from PyPI (PySide6) instead of apt: no dependency on the
      # Ubuntu mirrors, which have failed DNS on the runners.
      - run: pip install --quiet "PySide6-Essentials>=6.7"
      - name: QML parses
        run: |
          for f in quickshell/stance/*.qml quickshell/integrations/*/*.qml; do
            pyside6-qmlformat "$f" > /dev/null || { echo "QML parse error: $f"; exit 1; }
          done
      - run: python3 scripts/i18n-check.py
      - name: Shell scripts parse
        run: for f in tests/*.sh contrib/*.sh; do bash -n "$f"; done
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
